description: >-
  The Office of Government Ethics (OGE) is an independent agency within the federal
  government that oversees the behavior and ethics of executive branch employees.
  The OGE provides guidance and advice on ethics laws and regulations to government
  officials, conducts ethics training programs, and reviews financial disclosure reports
  to ensure compliance with ethical standards. The office also works to prevent conflicts
  of interest and promote transparency and accountability in government operations.
